version: '3.8'

# ============================================
# SRS-Proxy 代理层 - 统一模式
# 配合 docker-compose.srs.unified.yml 使用
# ============================================

services:
  srs-proxy:
    image:  local/srs-proxy:v7
    container_name: srs-proxy
    hostname: srs-proxy
    restart: always

    ports:
      - '1935:1935/tcp'      # RTMP
      - '1985:1985/tcp'      # HTTP API
      - '8081:8080/tcp'      # HTTP Server
      - '8000:8000'           # WebRTC (TCP信令 + UDP媒体)
      - '12025:12025/tcp'    # 集群管理

    volumes:
      - ./conf/proxy.srs.conf:/tmp/proxy.conf:ro

    entrypoint:
      ['/bin/sh', '-c', 'mkdir -p /trunk/research && exec srs-proxy -c /tmp/proxy.conf']

    environment:
      - PROXY_RTMP_SERVER=1935
      - PROXY_HTTP_SERVER=8080
      - PROXY_HTTP_API=1985
      - PROXY_WEBRTC_SERVER=8000
      - PROXY_SRT_SERVER=10080
      - PROXY_SYSTEM_API=12025
      - PROXY_HTTP_STATIC_ENABLE=false
      - PROXY_LOAD_BALANCER_TYPE=memory
      - PROXY_REDIS_HOST=172.16.6.116
      - PROXY_REDIS_PORT=16379
      - PROXY_REDIS_PASSWORD=lmw121+_
      - PROXY_CANDIDATE=8.137.165.18

    networks:
      - srs-shared

networks:
  srs-shared:
    external: true
