version: '3.8'

# ============================================
# SRS-Proxy 代理层 - 统一模式（低资源兼容）
# 
# 适用场景：
# - 用户量少，资源有限（1-2台服务器）
# - 直播和录制共用同一套 SRS 节点
# - 所有 Origin 节点都开启 DVR（直播也录制）
#
# 架构说明：
# - srs-proxy: 单实例，所有流统一入口
# - origin-1 / origin-2: 都注册到同一个 srs-proxy
# - 所有节点 DVR 开启
# 
# 依赖：外部 Redis（由 docker-compose.yml 提供）
# ============================================

services:
  # ============================================
  # SRS-Proxy（统一入口）
  # 功能：统一入口、负载均衡、流路由
  # ============================================
  srs-proxy:
    image: ossrs/srs:v7.0.78
    container_name: srs-proxy
    hostname: srs-proxy
    restart: always
    command: srs-proxy
    
    ports:
      - "1935:1935/tcp"      # RTMP 代理入口
      - "8080:8080/tcp"      # HTTP 代理入口
      - "1985:1985/tcp"      # HTTP API 代理入口
      - "8000:8000/udp"      # WebRTC UDP 代理入口
      - "12025:12025/tcp"    # 系统 API / 管理接口
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    
    environment:
      # SRS Proxy 服务端口配置
      - PROXY_RTMP_SERVER=1935
      - PROXY_HTTP_SERVER=8080
      - PROXY_HTTP_API=1985
      - PROXY_WEBRTC_SERVER=8000
      - PROXY_SRT_SERVER=10080
      - PROXY_SYSTEM_API=12025
      
      # 负载均衡模式
      # memory: 单机内存模式（无需 Redis，适合单节点测试）
      # redis: 使用 Redis 共享节点状态（多节点部署推荐）
      - PROXY_LOAD_BALANCER_TYPE=redis
      
      # Redis 配置（用于节点状态同步和负载均衡）
      - PROXY_REDIS_HOST=redis
      - PROXY_REDIS_PORT=6379
      - PROXY_REDIS_PASSWORD=${REDIS_PASSWORD}
      
      # WebRTC 候选地址（公网 IP）
      - PROXY_CANDIDATE=${PUBLIC_IP}
    
    # 依赖 Redis（通过外部网络连接）
    depends_on:
      - redis
    
    networks:
      - srs-network

  # ============================================
  # 可选：TURN 服务器（用于 WebRTC NAT 穿透）
  # ============================================
  turn-server:
    image: coturn/coturn:latest
    container_name: srs-turn
    hostname: srs-turn
    restart: unless-stopped
    
    ports:
      - "3478:3478"          # TURN/STUN TCP
      - "3478:3478/udp"      # TURN/STUN UDP
      - "3479:3479"          # TURN/STUN TLS
      - "49152-65535:49152-65535/udp"  # TURN relay 端口范围
    
    environment:
      - LISTENING_PORT=3478
      - EXTERNAL_IP=${PUBLIC_IP}
      - REALM=srs-proxy.example.com
      - USER=user1:pass1
      - MIN_PORT=49152
      - MAX_PORT=65535
    
    command: >
      -n
      --log-file=stdout
      --external-ip=${PUBLIC_IP}
      --realm=srs-proxy.example.com
      --user=user1:pass1
      --min-port=49152
      --max-port=65535
    
    networks:
      - srs-network

# ============================================
# 网络配置（使用外部网络，与 docker-compose.yml 共享）
# ============================================
networks:
  srs-network:
    external: true
