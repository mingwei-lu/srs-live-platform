version: '3.8'

configs:
  origin1_cfg:
    file: ./conf/origin1.conf
  origin2_cfg:
    file: ./conf/origin2.conf

services:
  srs-origin-1:
    image: ossrs/srs:v7.0.157
    container_name: srs-origin-1
    hostname: srs-origin-1
    restart: always
    entrypoint: [""]
    ports:
      - "11935:1935"
      - "11986:1986"
      - "18080:8080"
      - "18000:8000/udp"
    volumes:
      - /home/lumingwei/srs/hls/origin1:/usr/local/srs/objs/nginx/html
      - /home/lumingwei/srs/recordings/origin1:/data/recordings
    configs:
      - source: origin1_cfg
        target: /tmp/srs.conf
    command: ./objs/srs -c /tmp/srs.conf
    networks:
      - srs-shared

  srs-origin-2:
    image: ossrs/srs:v7.0.157
    container_name: srs-origin-2
    hostname: srs-origin-2
    restart: always
    entrypoint: [""]
    ports:
      - "12935:1935"
      - "12986:1986"
      - "19080:8080"
      - "19000:8000/udp"
    volumes:
      - /home/lumingwei/srs/hls/origin2:/usr/local/srs/objs/nginx/html
      - /home/lumingwei/srs/recordings/origin2:/data/recordings
    configs:
      - source: origin2_cfg
        target: /tmp/srs.conf
    command: ./objs/srs -c /tmp/srs.conf
    networks:
      - srs-shared

networks:
  srs-shared:
    external: true

