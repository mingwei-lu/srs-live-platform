version: "3.8"

# ============================================
# SRS 源站集群 - 统一模式（低资源兼容）
# 所有 Origin 节点都注册到同一个 srs-proxy
# 所有节点都开启 DVR
# 依赖：外部 Redis（由 docker-compose.yml 提供）
# ============================================

services:
  # ============================================
  # Origin 源站节点 1
  # ============================================
  origin-1:
    image: registry.cn-hangzhou.aliyuncs.com/ossrs/srs:7
    container_name: srs-origin-1
    hostname: origin-1
    restart: always
    
    expose:
      - "1935"
      - "1985"
      - "8080"
      - "8000/udp"
    
    environment:
      - SRS_CANDIDATE=${PUBLIC_IP}
      - SRS_API_PASSWORD=${SRS_API_PASSWORD}
      # 统一模式：所有节点注册到同一个 srs-proxy
      - SRS_PROXY_HOST=srs-proxy
      # 统一模式：所有节点都开启 DVR
      - SRS_DVR_ENABLED=on
      # Redis 配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    
    volumes:
      - ./conf/origin.conf:/usr/local/srs/conf/origin.conf:ro
      - ./hls/origin1:/usr/local/srs/objs/nginx/html
      - ./recordings/origin1:/data/recordings
    
    command: ./objs/srs -c conf/origin.conf
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1985/api/v1/servers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - srs-network

  # ============================================
  # Origin 源站节点 2
  # ============================================
  origin-2:
    image: registry.cn-hangzhou.aliyuncs.com/ossrs/srs:7
    container_name: srs-origin-2
    hostname: origin-2
    restart: always
    
    expose:
      - "1935"
      - "1985"
      - "8080"
      - "8000/udp"
    
    environment:
      - SRS_CANDIDATE=${PUBLIC_IP}
      - SRS_API_PASSWORD=${SRS_API_PASSWORD}
      # 统一模式：所有节点注册到同一个 srs-proxy
      - SRS_PROXY_HOST=srs-proxy
      # 统一模式：所有节点都开启 DVR
      - SRS_DVR_ENABLED=on
      # Redis 配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    
    volumes:
      - ./conf/origin.conf:/usr/local/srs/conf/origin.conf:ro
      - ./hls/origin2:/usr/local/srs/objs/nginx/html
      - ./recordings/origin2:/data/recordings
    
    command: ./objs/srs -c conf/origin.conf
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1985/api/v1/servers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - srs-network

# ============================================
# 网络配置（使用外部网络，与 docker-compose.yml 共享）
# ============================================
networks:
  srs-network:
    external: true
