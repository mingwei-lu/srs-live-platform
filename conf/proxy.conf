listen              1935;
max_connections     2000;
srs_log_tank        file;
srs_log_file        ./objs/srs.log;

http_api {
    enabled         on;
    listen          1986;
}

http_server {
    enabled         on;
    listen          8080;
}

rtc_server {
    enabled on;
    listen 8000;
}

cluster {
    mode proxy;
    origin srs-origin-1:1935 srs-origin-2:1935;
}

vhost __defaultVhost__ {
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled         on;
        hls_fragment    10;
        hls_window      60;
    }
}

