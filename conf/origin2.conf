listen              1935;
max_connections     1000;
srs_log_tank        file;
srs_log_file        ./objs/srs.log;

http_api {
    enabled         on;
    listen          1986;
}

http_server {
    enabled         on;
    listen          8080;
}

rtc_server {
    enabled on;
    listen 8000;
}

vhost __defaultVhost__ {
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    10;
        hls_window      60;
    }
    dvr {
        enabled on;
        dvr_path /data/recordings/[app]/[stream]/[timestamp].mp4;
        dvr_plan session;
    }
}

