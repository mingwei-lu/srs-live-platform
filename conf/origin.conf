# SRS Origin 节点通用配置文件
# 通过环境变量 SRS_DVR_ENABLED 控制是否开启 DVR 录制
# origin-1: SRS_DVR_ENABLED=off (直播节点)
# origin-2: SRS_DVR_ENABLED=on  (录制节点)

listen              1935;
max_connections     1000;
srs_log_tank        file;
srs_log_file        ./objs/srs.log;

# HTTP API 配置
http_api {
    enabled         on;
    listen          1985;
    auth {
        enabled     on;
        username    admin;
        password    ${SRS_API_PASSWORD:admin};
    }
}

# HTTP 服务器配置（用于 HLS/FLV 分发）
http_server {
    enabled         on;
    listen          8080;
    root            ./objs/nginx/html;
}

# WebRTC 服务器配置
rtc_server {
    enabled         on;
    protocol        udp;
    listen          8000;
    candidate       ${SRS_CANDIDATE:127.0.0.1};
}

# ============================================
# 源站注册到 srs-proxy 网关（docker 内网域名）
# 通过环境变量 SRS_PROXY_HOST 指定不同的 proxy 实例
#   origin-1 (直播): SRS_PROXY_HOST=srs-proxy-live
#   origin-2 (录制): SRS_PROXY_HOST=srs-proxy-record
# ============================================
cluster {
    mode            origin;
    proxy           ${SRS_PROXY_HOST:srs-proxy-live}:12025;
}

# ============================================
# 虚拟主机配置
# ============================================
vhost __defaultVhost__ {
    
    # HTTP-FLV 直播分发
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS 直播分发
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      10;
    }

    # WebRTC 配置（启用 RTC<>RTMP 互通，DVR 录制需要）
    rtc {
        enabled             on;
        rtmp_to_rtc         on;
        rtc_to_rtmp         on;
    }
    
    # RTMP 配置
    rtmp {
        enabled         on;
    }
    
    # ============================================
    # DVR 录制配置（通过环境变量控制）
    # ============================================
    dvr {
        enabled         ${SRS_DVR_ENABLED:off};
        dvr_path        /data/recordings/[app]/[stream]/[timestamp].mp4;
        dvr_plan        session;        # 按会话录制（推流到结束为一个文件）
        dvr_wait_keyframe on;           # 等待关键帧开始录制
        dvr_time_jitter full;           # 时间戳抖动修正
    }
    
    # HTTP 回调配置（通知后端业务逻辑 + 录制完成回调）
    http_hooks {
        enabled             on;
        on_publish          http://backend:8080/api/v1/srs/callback/on_publish;
        on_unpublish        http://backend:8080/api/v1/srs/callback/on_unpublish;
        on_play             http://backend:8080/api/v1/srs/callback/on_play;
        on_stop             http://backend:8080/api/v1/srs/callback/on_stop;
        on_dvr              http://backend:8080/api/v1/srs/callback/on_dvr;
    }
    
    # 推流鉴权（可选）
    publish {
        normal_timeout  30;
    }
}
