# SRS Origin config
# Environment: SRS_DVR_ENABLED controls dvr on/off
listen              1935;
max_connections     1000;
srs_log_tank        file;
srs_log_file        ./objs/srs.log;

http_api {
    enabled         on;
    listen          1986;
    auth {
        enabled     on;
        username    admin;
        password    ${SRS_API_PASSWORD:admin};
    }
}

http_server {
    enabled         on;
    listen          8080;
    root            ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    protocol        udp;
    listen          8000;
    candidate       ${SRS_CANDIDATE:8.137.165.18};
}

cluster {
    mode            origin;
    proxy           ${SRS_PROXY_HOST:srs-proxy}:12025;
}

vhost __defaultVhost__ {
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      10;
    }

    rtc {
        enabled             on;
        rtmp_to_rtc         on;
        rtc_to_rtmp         on;
    }

    rtmp {
        enabled         on;
    }

    dvr {
        enabled         ${SRS_DVR_ENABLED:off};
        dvr_path        /data/recordings/[app]/[stream]/[timestamp].mp4;
        dvr_plan        session;
        dvr_wait_keyframe on;
        dvr_time_jitter full;
    }

    http_hooks {
        enabled             on;
        on_publish          http://${BACKEND_HOST:172.16.6.116}:8180/api/v1/srs/callback/on_publish;
        on_unpublish        http://${BACKEND_HOST:172.16.6.116}:8180/api/v1/srs/callback/on_unpublish;
        on_play             http://${BACKEND_HOST:172.16.6.116}:8180/api/v1/srs/callback/on_play;
        on_stop             http://${BACKEND_HOST:172.16.6.116}:8180/api/v1/srs/callback/on_stop;
        on_dvr              http://${BACKEND_HOST:172.16.6.116}:8180/api/v1/srs/callback/on_dvr;
    }

    publish {
        normal_timeout  30;
    }
}
