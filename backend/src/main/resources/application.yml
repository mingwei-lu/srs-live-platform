server:
  port: 8180

spring:
  application:
    name: srs-live-platform

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/srs_live?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 5000
      max-lifetime: 600000

  data:
    redis:
      host: ${REDIS_HOST:8.137.165.18}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:lmw121+_}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.srs.live.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== 业务配置 =====
srs:
  # 当前节点ID，多实例需唯一
  node-id: ${NODE_ID:ws-node-1}

  # JWT 配置
  jwt:
    secret: ${JWT_SECRET:srs-live-platform-jwt-secret-key-2024}
    expiration: 7200

  # SRS 媒体服务器配置
  srs:
    api-password: ${SRS_API_PASSWORD:admin}
    # ============================================
    # SRS 运行模式: separate(分离模式) 或 unified(统一模式)
    # ============================================
    # separate: 直播/录制节点分离，高资源推荐
    #   - 2个 srs-proxy 实例 (srs-proxy-live / srs-proxy-record)
    #   - origin-1 (直播, DVR off) / origin-2 (录制, DVR on)
    #   - Java 后端根据 nodeType 路由到不同 proxy
    #
    # unified: 直播/录制共用同一套 SRS，低资源兼容
    #   - 1个 srs-proxy 实例
    #   - 所有 Origin 节点都开启 DVR (直播也录制)
    #   - Java 后端不区分 nodeType，统一调度
    # ============================================
    mode: ${SRS_MODE:unified}
    
    # ============================================
    # 统一模式配置 (unified mode)
    # ============================================
    # 单 srs-proxy 地址（所有流都经过此 proxy）
    unified-proxy-host: ${SRS_UNIFIED_PROXY_HOST:8.137.165.18}
    unified-proxy-port: ${SRS_UNIFIED_PROXY_PORT:1985}
    
    # ============================================
    # 分离模式配置 (separate mode)
    # ============================================
    # 直播节点代理：srs-proxy-live，端口 1935/8080/1985/8000
    # 录制节点代理：srs-proxy-record，端口 1936/8081/1986/8001
    live-proxy-host: ${SRS_LIVE_PROXY_HOST:srs-proxy-live}
    live-proxy-port: ${SRS_LIVE_PROXY_PORT:8000}
    record-proxy-host: ${SRS_RECORD_PROXY_HOST:srs-proxy-record}
    record-proxy-port: ${SRS_RECORD_PROXY_PORT:8001}
    
    # 候选地址（WebRTC 公网 IP）
    candidate: ${SRS_CANDIDATE:8.137.165.18}

  # WebSocket 配置
  websocket:
    boss-threads: 1
    worker-threads: 8
    max-frame-size: 65536
    idle-timeout: 60000

  # 集群配置
  cluster:
    health-check-interval: 10000
    heartbeat-timeout: 45000
    heartbeat-scan-interval: 10000

  # 限流配置
  rate-limit:
    ws-message: 10
    api-per-minute: 1000

  # 第三方服务
  third-party:
    auth-enabled: true
    timestamp-tolerance: 300000

# MinIO 对象存储（录播文件）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:live-recordings}

logging:
  level:
    com.srs.live: INFO
